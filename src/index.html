<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AuraVault</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="styles.css" />
  <script src="js/boot-theme.js"></script>
</head>
<body>
  <!-- Animated gradient wallpaper that everything glassy blurs over -->
  <div class="wallpaper" aria-hidden="true">
    <img class="wp-img" src="assets/wallpaper-light.jpg" alt="" draggable="false" />
    <img class="wp-img dark" src="assets/wallpaper-dark.jpg" alt="" draggable="false" />
    <div class="wp-tint"></div>
  </div>

  <div id="app" class="app" hidden>
    <!-- Custom title bar (frameless window) -->
    <header class="titlebar" id="titlebar">
      <div class="tb-brand">
        <img class="tb-logo" src="assets/logo.svg" alt="" draggable="false" />
        <span class="tb-name">AuraVault</span>
        <span class="tb-pill" id="demoPill" hidden>Preview</span>
      </div>
      <div class="tb-drag"></div>
      <div class="win-controls" id="winControls" hidden>
        <button class="wc" id="wcMin" aria-label="Minimize window" tabindex="-1">
          <svg viewBox="0 0 24 24" width="11" height="11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <button class="wc" id="wcMax" aria-label="Maximize window" tabindex="-1">
          <svg class="max-a" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/></svg>
          <svg class="max-b" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8.5 5.5h7a3 3 0 0 1 3 3v7"/><path d="M15.5 18.5h-7a3 3 0 0 1-3-3v-7"/></svg>
        </button>
        <button class="wc wc-close" id="wcClose" aria-label="Close window" tabindex="-1">
          <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <!-- Glass sidebar -->
      <aside class="sidebar">
        <nav class="sb-nav" id="sbNav" aria-label="Vault sections">
          <div class="sb-pill" id="sbPill" aria-hidden="true"></div>
        </nav>
        <div class="sb-lock">
          <button class="nav-item lock-nav" id="btnLock">
            <span class="nav-ic" id="btnLockIcon"></span>
            <span class="nav-label">Lock Vault</span>
            <span class="lock-kbd">Ctrl L</span>
          </button>
        </div>
      </aside>

      <!-- Glass content card with animated pages -->
      <main class="content">
        <div class="pages" id="pages">
          <section class="page" id="page-home" data-page="home">
            <div class="compact-bar"><div class="compact-title" id="homeCompactTitle">All Items</div></div>
            <div class="page-scroll" id="homeScroll">
              <div class="page-inner">
                <div class="ph-row">
                  <h1 class="big-title" id="homeTitle">All Items</h1>
                  <button class="btn-add" id="btnAdd" aria-label="Add new item" title="Add item (Ctrl+N)">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                  </button>
                </div>
                <label class="search">
                  <span class="search-icon" id="searchIcon"></span>
                  <input id="searchInput" type="text" placeholder="Search your vault" autocomplete="off" spellcheck="false" />
                  <button class="search-clear" id="searchClear" hidden aria-label="Clear search">
                    <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
                  </button>
                </label>
                <div class="list" id="homeList"></div>
              </div>
            </div>
          </section>

          <section class="page" id="page-detail" data-page="detail">
            <div class="page-scroll" id="detailScroll"></div>
          </section>

          <section class="page" id="page-generator" data-page="generator">
            <div class="page-scroll" id="genScroll"></div>
          </section>

          <section class="page" id="page-settings" data-page="settings">
            <div class="page-scroll" id="setScroll"></div>
          </section>

          <section class="page" id="page-trash" data-page="trash">
            <div class="page-scroll" id="trashScroll"></div>
          </section>

          <section class="page" id="page-security" data-page="security">
            <div class="page-scroll" id="secScroll"></div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <!-- Overlay layers -->
  <div id="lockLayer" class="lock-layer" hidden></div>
  <div id="sheetLayer" class="sheet-layer" hidden></div>
  <div id="actionLayer" class="action-layer" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
