name: Build AuraVault

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build one-click installer + portable exe
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraVault-Windows-x64
          path: |
            dist/AuraVault-Setup-*.exe
            dist/AuraVault-Portable-*.exe
          if-no-files-found: error

      - name: Attach installers to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
