# AuraVault — electron-builder configuration
# Docs: https://www.electron.build

appId: com.auravault.app
productName: AuraVault
copyright: Copyright © 2026 AuraVault Contributors

directories:
  output: dist
  buildResources: resources

# Everything the packaged app needs at runtime
files:
  - main.js
  - preload.js
  - src/**/*
  - resources/icon.png
  - package.json
  - LICENSE

asar: true

# ---------- Windows ----------
win:
  icon: resources/icon.ico
  # Sign & edit uses rcedit (needs Wine when cross-building from Linux/macOS).
  # The GitHub Actions workflow builds on real Windows, where no Wine is needed.
  target:
    - target: nsis
      arch:
        - x64

# One-click installer — silent, per-user (no UAC prompt), desktop + start menu shortcuts
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AuraVault
  artifactName: AuraVault-Setup-${version}.${ext}

# Standalone portable exe (no install needed)
portable:
  artifactName: AuraVault-Portable-${version}.${ext}
